version: '3.8'

services:
  # ===================================================================
  # Database Service: MySQL 8.0
  # ===================================================================
  mysql:
    image: mysql:8.0
    container_name: cloudpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cloudpulse_db}
      MYSQL_USER: ${DB_USER:-cloudpulse_user}
      MYSQL_PASSWORD: ${DB_PASS:-cloudpulse_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secure_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cloudpulse-network

  # ===================================================================
  # Application Service: CloudPulse Spring Boot 3 + Java 21
  # ===================================================================
  app:
    image: ${DOCKER_IMAGE:-ashishkrpandey1234/cloudpulse:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-cloudpulse_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cloudpulse_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-cloudpulse_pass}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cloudpulse-network

  # ===================================================================
  # Metrics Scraper: Prometheus
  # ===================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cloudpulse-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - cloudpulse-network

  # ===================================================================
  # Visualization: Grafana
  # ===================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: cloudpulse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cloudpulse-dashboard.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cloudpulse-network

networks:
  cloudpulse-network:
    name: cloudpulse-network
    driver: bridge

volumes:
  mysql_data:
    name: cloudpulse_mysql_data
  prometheus_data:
    name: cloudpulse_prometheus_data
  grafana_data:
    name: cloudpulse_grafana_data
