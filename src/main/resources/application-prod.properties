# ===================================================================
# CloudPulse Production Profile Configuration (Docker / AWS EC2)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/cloudpulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cloudpulse_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cloudpulse_pass}

# HikariCP Connection Pool Optimization for Production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Management Endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
